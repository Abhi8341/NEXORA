name: Build NEXORA Public APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Linux dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            wget \
            curl \
            openjdk-17-jdk \
            python3-pip \
            python3-venv \
            autoconf \
            automake \
            autopoint \
            libtool \
            pkg-config \
            cmake \
            libffi-dev \
            libssl-dev \
            libltdl-dev \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev

      - name: Set up Buildozer
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade buildozer cython

      - name: Install Android command line tools
        shell: bash
        run: |
          set -e

          SDK="/home/runner/buildozer/android/platform/android-sdk"

          mkdir -p "$SDK"

          cd /tmp

          wget -q \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip \
            -O android-tools.zip

          rm -rf "$SDK/cmdline-tools"

          mkdir -p "$SDK/cmdline-tools/latest"

          unzip -q android-tools.zip \
            -d "$SDK/cmdline-tools/latest"

          if [ -d "$SDK/cmdline-tools/latest/cmdline-tools" ]; then
            cp -a \
              "$SDK/cmdline-tools/latest/cmdline-tools/." \
              "$SDK/cmdline-tools/latest/"
            rm -rf "$SDK/cmdline-tools/latest/cmdline-tools"
          fi

          mkdir -p "$SDK/tools/bin"

          ln -sf \
            "$SDK/cmdline-tools/latest/bin/sdkmanager" \
            "$SDK/tools/bin/sdkmanager"

          ln -sf \
            "$SDK/cmdline-tools/latest/bin/avdmanager" \
            "$SDK/tools/bin/avdmanager"

          chmod +x \
            "$SDK/cmdline-tools/latest/bin/sdkmanager"

          echo "ANDROIDSDK=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"

          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK/tools/bin" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"

          echo "Checking Buildozer sdkmanager path..."

          "$SDK/tools/bin/sdkmanager" --version

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set -e

          SDK="/home/runner/buildozer/android/platform/android-sdk"

          yes | "$SDK/tools/bin/sdkmanager" --licenses || true

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -e

          SDK="/home/runner/buildozer/android/platform/android-sdk"

          "$SDK/tools/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-33" \
            "build-tools;33.0.2"

      - name: Verify sdkmanager
        shell: bash
        run: |
          SDK="/home/runner/buildozer/android/platform/android-sdk"

          echo "SDK location:"
          echo "$SDK"

          echo "sdkmanager:"
          ls -l "$SDK/tools/bin/sdkmanager"

          "$SDK/tools/bin/sdkmanager" --version

      - name: Build NEXORA APK
        shell: bash
        run: |
          set -e

          export ANDROIDSDK="/home/runner/buildozer/android/platform/android-sdk"
          export ANDROID_HOME="$ANDROIDSDK"

          export PATH="$ANDROIDSDK/tools/bin:$ANDROIDSDK/cmdline-tools/latest/bin:$ANDROIDSDK/platform-tools:$PATH"

          buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NEXORA-Public-APK
          path: bin/*.apk
          if-no-files-found: error