name: Build NEXORA Public APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            zip \
            unzip \
            wget \
            curl \
            openjdk-17-jdk \
            python3-pip \
            python3-venv \
            autoconf \
            automake \
            autopoint \
            libtool \
            pkg-config \
            cmake \
            libffi-dev \
            libssl-dev \
            libltdl-dev \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade buildozer cython

      - name: Prepare Buildozer SDK
        shell: bash
        run: |
          set -e

          SDK="$HOME/.buildozer/android/platform/android-sdk"

          mkdir -p "$SDK/cmdline-tools"

          cd /tmp

          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip \
            -O commandlinetools.zip

          rm -rf "$SDK/cmdline-tools/latest"
          mkdir -p "$SDK/cmdline-tools/latest"

          unzip -q commandlinetools.zip -d "$SDK/cmdline-tools/latest"

          if [ -d "$SDK/cmdline-tools/latest/cmdline-tools" ]; then
            mv "$SDK/cmdline-tools/latest/cmdline-tools/"* \
               "$SDK/cmdline-tools/latest/"
            rmdir "$SDK/cmdline-tools/latest/cmdline-tools"
          fi

          export ANDROIDSDK="$SDK"
          export ANDROID_HOME="$SDK"
          export PATH="$SDK/cmdline-tools/latest/bin:$SDK/platform-tools:$PATH"

          echo "ANDROIDSDK=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"

          echo "Checking sdkmanager..."
          "$SDK/cmdline-tools/latest/bin/sdkmanager" --version

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set -e

          SDK="$HOME/.buildozer/android/platform/android-sdk"

          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" \
            --licenses > /dev/null || true

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -e

          SDK="$HOME/.buildozer/android/platform/android-sdk"

          "$SDK/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-33" \
            "build-tools;33.0.2"

      - name: Verify Android SDK
        shell: bash
        run: |
          SDK="$HOME/.buildozer/android/platform/android-sdk"

          echo "SDK: $SDK"
          echo "sdkmanager:"
          "$SDK/cmdline-tools/latest/bin/sdkmanager" --version

          echo "adb:"
          "$SDK/platform-tools/adb" version

          echo "Build tools:"
          ls -la "$SDK/build-tools"

          echo "Platforms:"
          ls -la "$SDK/platforms"

      - name: Build NEXORA APK
        shell: bash
        run: |
          set -e

          export ANDROIDSDK="$HOME/.buildozer/android/platform/android-sdk"
          export ANDROID_HOME="$ANDROIDSDK"
          export PATH="$ANDROIDSDK/cmdline-tools/latest/bin:$ANDROIDSDK/platform-tools:$PATH"

          buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NEXORA-Public-APK
          path: bin/*.apk
          if-no-files-found: error