name: Build NEXORA Public APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Linux dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            wget \
            curl \
            openjdk-17-jdk \
            python3-pip \
            python3-venv \
            autoconf \
            automake \
            autopoint \
            libtool \
            pkg-config \
            cmake \
            libffi-dev \
            libssl-dev \
            libltdl-dev \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade buildozer
          python -m pip install "cython<3"

      - name: Prepare Buildozer configuration
        run: |
          if [ ! -f buildozer.spec ]; then
            echo "ERROR: buildozer.spec was not found."
            exit 1
          fi

          echo "Buildozer spec found."

          grep -q "^android.accept_sdk_license" buildozer.spec || \
            sed -i '/^\[app\]/a android.accept_sdk_license = True' buildozer.spec

          echo "SDK license setting:"
          grep "android.accept_sdk_license" buildozer.spec || true

      - name: Build NEXORA APK
        shell: bash
        run: |
          set -e

          yes | buildozer -v android debug

      - name: Check APK
        run: |
          echo "APK files:"
          find bin -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NEXORA-Public-APK
          path: bin/*.apk
          if-no-files-found: error