      - name: Accept licenses and install Build Tools
        shell: bash
        run: |
          set -e

          SDK="/home/runner/buildozer/android/platform/android-sdk"

          mkdir -p "$SDK/licenses"

          yes | "$SDK/tools/bin/sdkmanager" --licenses || true

          yes | "$SDK/tools/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-33" \
            "build-tools;37.0.0"

          echo "Build Tools installed:"
          ls -la "$SDK/build-tools/37.0.0"

      - name: Build NEXORA APK
        shell: bash
        run: |
          set -e

          export ANDROIDSDK="/home/runner/buildozer/android/platform/android-sdk"
          export ANDROID_HOME="$ANDROIDSDK"

          export PATH="$ANDROIDSDK/tools/bin:$ANDROIDSDK/cmdline-tools/latest/bin:$ANDROIDSDK/platform-tools:$ANDROIDSDK/build-tools/37.0.0:$PATH"

          yes | buildozer -v android debug