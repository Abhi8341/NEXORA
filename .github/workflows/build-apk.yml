name: Build NEXORA Public APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build NEXORA APK
    runs-on: ubuntu-22.04

    steps:

      - name: Checkout NEXORA
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Linux dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            wget \
            curl \
            autoconf \
            automake \
            autopoint \
            libtool \
            pkg-config \
            cmake \
            build-essential \
            libffi-dev \
            libssl-dev \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libtinfo5

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade buildozer
          python -m pip install "cython<3"

      - name: Check NEXORA files
        run: |
          echo "Repository files:"
          ls -la

          echo "Checking main.py:"
          test -f main.py

          echo "Checking buildozer.spec:"
          test -f buildozer.spec

      - name: Build NEXORA APK
        env:
          P4A_RELEASE_KEYSTORE: ""
        run: |
          yes | buildozer -v android debug

      - name: Show generated APK
        run: |
          echo "APK files:"
          find bin -type f -name "*.apk" -print

      - name: Upload NEXORA APK
        uses: actions/upload-artifact@v4
        with:
          name: NEXORA-Public-APK
          path: bin/*.apk
          if-no-files-found: error
